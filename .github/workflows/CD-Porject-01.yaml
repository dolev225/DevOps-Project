name: CI/CD Devops-Project-01

on:
  push:
    paths:
      - 'Cloude/DevOps-Project-01/**'
  workflow_dispatch:

jobs:
  #--------------------Terraform-validate--------------------#
  validate-and-plan:
    runs-on: ubuntu-latest
    name: Terraform Validate and Plan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init
        working-directory: Cloude/DevOps-Project-01/Deploy-EC2
        run: terraform init

 
      - name: Terraform Validate
        working-directory: Cloude/DevOps-Project-01/Deploy-EC2
        run: terraform validate

      - name: Terraform Validate
        working-directory: Cloude/DevOps-Project-01/Deploy-EC2
        run: terraform plan
  #--------------------ShellCheck-validate--------------------#
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          cek_path: 'Cloude/DevOps-Project-01'
        env:
          SHELLCHECK_OPTS: "-e SC2086"
  #--------------------CD--------------------#