<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קבצים בענן</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .upload-box { margin: 20px 0; padding: 15px; background: #e9ecef; border-radius: 6px; }
        progress { width: 100%; height: 20px; margin-top: 10px; display: none; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        a.btn { background: #28a745; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; }
        a.btn:hover { background: #218838; }
        .logout { color: #dc3545; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>שלום, {{ username }}</h2>
            <a href="/logout" class="logout">התנתק</a>
        </header>

        <div class="upload-box">
            <h3>העלאת קובץ חדש</h3>
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">העלה לענן</button>
            
            <progress id="progressBar" value="0" max="100"></progress>
            <p id="status"></p>
        </div>

        <h3>הקבצים שלי</h3>
        <ul>
            {% for file in files %}
                <li>
                    <span>{{ file.name }}</span>
                    <a href="#" class="btn" onclick="downloadFile('{{ file.key }}')">הורד</a>
                </li>
            {% else %}
                <p>אין קבצים בחשבון עדיין.</p>
            {% endfor %}
        </ul>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const progressBar = document.getElementById('progressBar');

            if (fileInput.files.length === 0) {
                alert('אנא בחר קובץ להעלאה');
                return;
            }
            const file = fileInput.files[0];
            status.innerText = 'מייצר לינק העלאה...';

            try {
                const res = await fetch('/get-upload-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_name: file.name })
                });
                const data = await res.json();
                
                if (data.error) {
                    status.innerText = 'שגיאה: ' + data.error;
                    return;
                }

                progressBar.style.display = 'block';
                progressBar.value = 0;
                status.innerText = 'מעלה קובץ ל-S3... 0%';

                await uploadToS3WithProgress(data.url, file, progressBar, status);

            } catch (err) {
                status.innerText = 'שגיאה בתהליך ההעלאה.';
                console.error(err);
            }
        }

        function uploadToS3WithProgress(url, file, progressBar, status) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (event) => {
                    if (event.lengthComputable) {
                        const percentComplete = Math.round((event.loaded / event.total) * 100);
                        progressBar.value = percentComplete;
                        status.innerText = `מעלה קובץ ל-S3... ${percentComplete}%`;
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        status.innerText = 'ההעלאה הוצלחה! מרענן דף...';
                        setTimeout(() => location.reload(), 1000);
                        resolve();
                    } else {
                        status.innerText = 'ההעלאה נכשלה מול S3 (סטטוס: ' + xhr.status + ')';
                        reject(xhr.statusText);
                    }
                });

                xhr.addEventListener('error', () => {
                    status.innerText = 'שגיאת רשת במהלך ההעלאה.';
                    reject('Network error');
                });

                xhr.open('PUT', url);
                // שליחת ה-Content-Type בדיוק כמו שהוגדר בשרת למניעת שגיאת 403
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                xhr.send(file);
            });
        }

        async function downloadFile(fileKey) {
            const res = await fetch('/get-download-url', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_key: fileKey })
            });
            const data = await res.json();
            if (data.url) {
                window.location.href = data.url;
            } else {
                alert('שגיאה בהורדת הקובץ: ' + data.error);
            }
        }
    </script>
</body>
</html>
